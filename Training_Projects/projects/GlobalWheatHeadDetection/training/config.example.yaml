# training/config.example.yaml
#
# Public example training config for the project:
# Global Wheat Head Detection 2021 YOLO object-detection training.
#
# Copy this file to:
#   training/config.yaml
# ---------------------------------------------------------------------------
# Frequently changed run identity settings
# ---------------------------------------------------------------------------
#
# These two values control both:
#
#   1. Local run directory layout:
#        training/train_yolo/run_dirs/<experiment_name>/<resolved_run_name>/
#
#   2. MLflow organization:
#        MLflow experiment name = experiment_name
#        MLflow run name        = resolved_run_name
#
# If run_name already exists under the experiment folder, the training script
# appends _1, _2, _3, ... to create a unique resolved run name.
run:
  # Parent experiment name for local run folders and MLflow.
  experiment_name: &experiment_name global-wheat-head-detection

  # Base run name / MLflow run name for this specific training attempt.
  run_name: &run_name baseline_001_yolo11n_e50_img640_b8


project:
  # Stable repo/project identity. Keep this mostly constant across runs.
  name: global-wheat-head-detection

  # Human-readable project title.
  display_name: Global Wheat Head Detection 2021

  # Short project description for logs, summaries, and MLflow metadata.
  description: >
    YOLO object-detection training workflow for dense single-class wheat-head
    detection using a CVDMS-exported Global Wheat Head Detection 2021 dataset.

  # High-level ML task type.
  task: object-detection


dataset:
  # Local name for this YOLO-format export.
  name: global-wheat-head-2021-v1

  # System that produced the dataset artifacts.
  source_system: cvdms

  # CVDMS label/task type.
  label_type: object-detection

  # Original CVDMS dataset ID.
  cvdms_dataset_id: global-wheat-head-2021

  # Original CVDMS dataset version.
  cvdms_dataset_version: 1

  # YOLO dataset YAML produced by the CVDMS-to-YOLO converter.
  dataset_yaml: training/data/yolo/global-wheat-head-2021-v1/dataset.yaml

  # Detailed conversion report saved during CVDMS-to-YOLO export.
  conversion_report: training/data/yolo/global-wheat-head-2021-v1/conversion_report_detailed.json

  # Informational notes for humans, README writing, and MLflow params.
  notes:
    # Single class used by this dataset.
    class_name: wheat_head

    # Number of detection classes.
    class_count: 1

    # Official upstream train/val/test splits were preserved.
    split_policy: official_source_splits_preserved

    # Number of training images.
    train_images: 3605

    # Number of validation images.
    val_images: 1448

    # Number of test images.
    test_images: 1334

    # Average boxes per training image from the conversion report.
    train_avg_boxes_per_image: 45.4

    # Average boxes per validation image from the conversion report.
    val_avg_boxes_per_image: 30.6

    # Average boxes per test image from the conversion report.
    test_avg_boxes_per_image: 50.5


model:
  # You may use either a string arg or a path, e.g.:
  #   yolo11n.pt
  # or:
  #   training/train_yolo/weights/yolo11n.pt
  weights: yolo11n.pt

  # If model.weights is a known Ultralytics pretrained filename and the local
  # file does not exist, download/cache it here.
  weights_dir: training/train_yolo/weights

  # Allow automatic pretrained-weight download/caching for known YOLO weight names.
  auto_download_weights: true

  # Metadata only, not currently validated against specified weight param above.
  family: yolo11
  size: n


training:
  # Base run name. This is anchored from the top-level run section so the main
  # run identity is easy to edit.
  run_name: *run_name

  # Number of training epochs.
  epochs: 50

  # Input image size used by YOLO.
  imgsz: 640

  # Batch size. Increase on GPU if memory allows.
  batch: 8

  # Device selection:
  #   auto = use CUDA GPU 0 if available, otherwise CPU
  #   cpu  = force CPU
  #   0    = force first CUDA GPU
  #   1    = force second CUDA GPU
  device: auto

  # DataLoader workers. On Windows, 0 is safest; on GPU/Linux, higher values may help.
  workers: 0

  # Freeze layers during fine-tuning:
  #   null = no explicit freeze
  #   10   = freeze first 10 layers
  freeze: null

  # Early stopping patience in epochs.
  patience: 20

  # Random seed for repeatability.
  seed: 42

  # Request deterministic behavior where supported.
  deterministic: true

  # Save YOLO plots such as curves, confusion matrices, and PR/F1/P/R curves.
  plots: true

  # Dataset caching:
  #   false = no cache
  #   ram   = cache in memory
  #   disk  = cache on disk
  cache: false

  # Optimizer:
  #   auto lets Ultralytics choose optimizer/lr/momentum.
  optimizer: auto

  # Initial learning rate. null means use Ultralytics/default/auto.
  lr0: null

  # Final learning-rate factor. null means use Ultralytics/default/auto.
  lrf: null

  # Optimizer momentum. null means use Ultralytics/default/auto.
  momentum: null

  # Weight decay. null means use Ultralytics/default/auto.
  weight_decay: null

  # Warmup epochs. null means use Ultralytics default.
  warmup_epochs: null

  # Warmup momentum. null means use Ultralytics default.
  warmup_momentum: null

  # Warmup bias learning rate. null means use Ultralytics default.
  warmup_bias_lr: null

  # Use cosine learning-rate schedule if true. null means use Ultralytics default.
  cos_lr: null

  # Automatic mixed precision. true is usually preferred on supported GPUs.
  amp: true

  # Rotation augmentation in degrees. null means use Ultralytics default.
  degrees: null

  # Translation augmentation fraction. null means use Ultralytics default.
  translate: null

  # Scale augmentation range. null means use Ultralytics default.
  scale: null

  # Shear augmentation in degrees. null means use Ultralytics default.
  shear: null

  # Perspective augmentation amount. null means use Ultralytics default.
  perspective: null

  # Horizontal flip probability. null means use Ultralytics default.
  fliplr: null

  # Vertical flip probability. null means use Ultralytics default.
  flipud: null

  # Mosaic augmentation probability. null means use Ultralytics default.
  mosaic: null

  # MixUp augmentation probability. null means use Ultralytics default.
  mixup: null

  # Disable mosaic during final N epochs. null means use Ultralytics default.
  close_mosaic: null


evaluation:
  # Evaluate best.pt on the validation split after training.
  # This split is used for model selection / champion promotion.
  val:
    # Enable explicit post-training validation evaluation.
    enabled: true

    # YOLO split to evaluate.
    split: val

    # Save validation evaluation plots.
    plots: true

    # null means reuse training.imgsz.
    imgsz: null

    # null means reuse training.batch.
    batch: null

    # null means reuse resolved training device.
    device: null

    # null means reuse training.workers.
    workers: null

    # Confidence threshold. null means use Ultralytics default.
    conf: null

    # IoU threshold. null means use Ultralytics default.
    iou: null

    # Max detections per image. Dense wheat imagery may need a higher value than
    # generic object-detection datasets.
    max_det: 300

    # Save COCO-style JSON predictions if supported/needed.
    save_json: false

    # Save YOLO txt predictions.
    save_txt: false

    # Save confidence scores with txt predictions.
    save_conf: false

  # Evaluate best.pt on the final held-out test split after training.
  # This split is for final reporting, not model selection.
  test:
    # Enable explicit post-training test evaluation.
    enabled: true

    # YOLO split to evaluate.
    split: test

    # Save test evaluation plots.
    plots: true

    # null means reuse training.imgsz.
    imgsz: null

    # null means reuse training.batch.
    batch: null

    # null means reuse resolved training device.
    device: null

    # null means reuse training.workers.
    workers: null

    # Confidence threshold. null means use Ultralytics default.
    conf: null

    # IoU threshold. null means use Ultralytics default.
    iou: null

    # Max detections per image. Dense wheat imagery may need a higher value than
    # generic object-detection datasets.
    max_det: 300

    # Save COCO-style JSON predictions if supported/needed.
    save_json: false

    # Save YOLO txt predictions.
    save_txt: false

    # Save confidence scores with txt predictions.
    save_conf: false


tensorboard:
  # Enable TensorBoard logging.
  enabled: true

  # Add readable config text to TensorBoard.
  log_config_text: true

  # Add explicit best.pt val/test eval metrics to TensorBoard.
  log_eval_metrics: true


paths:
  # Repeated run layout:
  #   training/train_yolo/run_dirs/<experiment_name>/<resolved_run_name>/
  run_root_dir: training/train_yolo/run_dirs

mlflow:
  # Enable MLflow tracking.
  enabled: true

  # Local MLflow tracking server URI.
  tracking_uri: http://127.0.0.1:5000

  # MLflow experiment name. This is anchored from the top-level run section so
  # the main run identity is easy to edit.
  experiment_name: *experiment_name

  # Registered model name for later model-selection/promotion scripts.
  registered_model_name: GlobalWheatHeadDetector

  # Alias for the deployed/best model version later.
  champion_alias: champion

  # Alias for a proposed candidate model version later.
  candidate_alias: candidate

  system_metrics:
    # Log CPU, memory, disk, network, and GPU utilization/memory when available.
    enabled: true

    # Collect system metrics every N seconds.
    sampling_interval_seconds: 10

    # Log every N collected samples.
    samples_before_logging: 1

    # Optional machine/node label for system metrics; useful later for multi-machine runs.
    node_id: local_training_machine

  # Extra MLflow tags for filtering/searching runs.
  tags:
    project: global-wheat-head-detection
    task: object_detection
    framework: ultralytics
    dataset_source: cvdms
    dataset_name: global-wheat-head-2021-v1
    label_type: object_detection
    model_family: yolo11
    run_group: baseline
    portfolio_project: "true"