[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cvdms-training-common"
version = "0.1.0"
description = "Shared PyTorch training utilities for consuming CVDMS dataset artifacts"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Brian Odle" }
]
dependencies = [
    "boto3>=1.34",
    "Pillow>=10.0",
    "torch>=2.1",
    "torchvision>=0.16",
    "tensorboard>=2.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cvdms_training_common*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true